name: ABL Space Systems
description: 'ABL Space Systems is an American launch vehicle company founded in 2017
  by Harry O''Hanley and Dan Piemont, headquartered in El Segundo, California, with
  operations at the Port of Long Beach, Mojave and Kodiak, Alaska. ABL built RS1, a
  two-stage, kerosene/liquid-oxygen small satellite launch vehicle designed to deliver
  1,350 kg to low Earth orbit and 1,000 kg to sun-synchronous orbit, powered by nine
  in-house additively manufactured E2 engines on the first stage and one on the second.
  Its companion GS0 ground system packages an entire orbital launch site into standard
  shipping containers so a pad can be activated anywhere with a flat concrete surface
  and moved by land, sea or air. RS1 attempted its first orbital flight from Pacific
  Spaceport Complex Kodiak in January 2023 and was lost shortly after liftoff; a second
  vehicle was destroyed during preflight static-fire testing in July 2024. In November
  2024 the company announced its exit from the commercial orbital launch market, and
  in February 2025 it rebranded as Long Wall, refocusing on containerized missile defense
  — the Cyclops exoatmospheric interceptor, RSX low-cost liquid boosters for flight
  testing and threat replication, and the Ironwood ground support equipment line. ABL/Long
  Wall is an aerospace and defense hardware manufacturer: it publishes no public developer
  API, SDK, machine-readable API contract or developer portal.'
